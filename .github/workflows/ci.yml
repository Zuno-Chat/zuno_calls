# Same checks as `make check`. Actions are pinned to commit SHAs; the comment
# is the tag that SHA was.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13" # the Synapse image's interpreter
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy
      - run: python -m pytest -q

  # A v* tag publishes ghcr.io/zuno-chat/zuno-calls-wheel:<tag> for the docker
  # repo's Synapse image. That repo reads it with its own GITHUB_TOKEN once
  # the package grants it read access (package settings > Manage Actions
  # access).
  wheel:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Tag matches pyproject version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject v$version"; exit 1; }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: wheel.Dockerfile
          # Both platforms the Synapse image is built for; COPY --from pulls
          # the variant matching the target.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/zuno-chat/zuno-calls-wheel:${{ github.ref_name }}
          provenance: false
